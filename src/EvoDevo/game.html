<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>EvoDevo - Game</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">

    <link href="css/game.css" rel="stylesheet" />
    <link href="css/pure_css/pure.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/evodevo.css" type="text/css">
    <link rel="icon" type="image/png" href="img/evodevo-logo.png">
    <script src="js/common/util.js"></script>
    <script type="text/javascript" src="js/game.js"></script>
</head>
<body onload="CheckUser()">
    
    <div id="layout" class="content pure-g">
        <!-- NAVIGATION MENU -->
        <div id="nav" class="pure-u">
            <a id="menu-button" href="#" class="nav-menu-button" onclick="toggleMenuClass('menu-button')">Menu</a>

            <div class="nav-inner">
                <p><span id="username"></span></p>

                <div class="pure-menu">
                    <ul id="item-list-menu" class="pure-menu-list">
                        <li class="pure-menu-item"><span id="player-menu-link" class="pure-menu-link pure-menu-active" onclick="SetItemList('player|Profile')">Profile</span></li>
                        <li class="pure-menu-item"><span id="chat-menu-link"    class="pure-menu-link" onclick="SetItemList('chat|Chat')">Chat</span></li>
                        <li class="pure-menu-item"><span id="species-menu-link" class="pure-menu-link" onclick="SetItemList('species|Species')">Species</span></li>
                        <li class="pure-menu-item"><span id="swarms-menu-link"  class="pure-menu-link" onclick="SetItemList('swarms|Swarms')">Swarms</span></li>
                        <li class="pure-menu-item"><span id="areas-menu-link"   class="pure-menu-link" onclick="SetItemList('areas|Areas')">Areas</span></li>
                        <li class="pure-menu-heading"></li>
                        <li class="pure-menu-item">
                            <span class="pure-menu-link" onclick="SetView('mapview')">
                                <span class="game-view-world"></span>
                                <span id="mapview-menu-item">World</span>
                            </span>
                        </li>
                        <li class="pure-menu-item">
                            <span class="pure-menu-link" onclick="SetView('traitview')">
                                <span class="game-view-traits"></span>
                                <span id="traitview-menu-item">Traits</span>
                            </span>
                        </li>
                        <li class="pure-menu-item">
                            <span class="pure-menu-link" onclick="SetView('buildview')">
                                <span class="game-view-bodyplan"></span>
                                <span id="buildview-menu-item">Body plan</span>
                            </span>
                        </li>
                        <li class="pure-menu-item">
                            <span class="pure-menu-link" onclick="SetView('designview')">
                                <span class="game-view-design"></span>
                                <span id="designview-menu-item">Body design</span>
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        
        <!-- MAIN VIEWER -->
        <div id="main" class="pure-u-1">
            <div class="main-content">
                <div class="main-content-header pure-g">
                    <div class="pure-u-1-2">
                        <h1 id="main-title" class="main-content-title">Viewport</h1>
                    </div>
                </div>

                <div id="mapview" class="view-port">
                    <canvas id="mapviewCanvas" class="view-canvas" width="512" height="384"></canvas>
                </div>
                <div id="traitview" class="view-port">
                    <canvas id="traitviewCanvas" class="view-canvas" width="512" height="384"></canvas>
                </div>
                <div id="buildview" class="view-port">
                    <canvas id="buildviewCanvas" class="view-canvas" width="512" height="384"></canvas>
                </div>
                <div id="designview" class="view-port">
                    <canvas id="designviewCanvas" class="view-canvas" width="512" height="384"></canvas>
                </div>
            </div>
        </div>

        <!-- ITEM LIST -->
        <div id="list" class="pure-u-1">

            <template id="list-item-template">
                <div class="list-item pure-g">
                    <div class="pure-u">
                        <img width="64" height="64" alt="" class="list-item-icon" src=""/>
                    </div>
                    <div class="pure-u-3-4">
                        <h5 class="list-item-name">item-name</h5>
                        <h4 class="list-item-info">size: item-info</h4>
                        <p class="list-item-description"></p>
                    </div>
                </div>
            </template>

            <div class="l-box">
                <h3 id="itemlist-title" style="padding: 0em 1em 0em 1em;"></h3>
            </div>
            <div id="item-list" class="pure-u-1">

            </div>
            <!-- ITEM INPUT -->
            <div id="input" class="pure-u-1">
                <form id="chat-form" class="pure-form" hidden="hidden">
                    <fieldset class="pure-group">
                        <textarea id="txtChat" class="pure-input-1-2" style="width: 100%" placeholder="Enter chat message"></textarea>
                        <button id="btnChat" type="submit" class="pure-button pure-input-1-2 pure-button-primary" style="width: 100%">Submit</button>
                    </fieldset>
                </form>
            </div>
            <!--SPINNER-->
            <img id="list-throbber" src="img/Lightness_rotate_36f_cw.gif" alt="Please wait..." width="80"
                 style="display: block; margin-top: 20%; margin-left: auto; margin-right: auto;" hidden="hidden" />
        </div>

    </div>
</body>
</html>
