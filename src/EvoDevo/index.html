<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>EvoDevo - Start </title>
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="//fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="icon" type="image/png" href="img/evodevo-logo.png">
    <script type="text/javascript" src="js/common/util.js"></script>
    <script type="text/javascript" src="js/start.js"></script>
</head>
<body>
    <div class="container">
        <h1>EvoDevo</h1>
        <div class="row">
            <div class="eight columns">
                <h2>Game</h2>
                <p>Lorem ipsum dolorem...</p>
                <div id="loginDiv">
                    <p id="login">
                        Username:
                        <input type="text" id="txtUsername" name="username" placeholder="Enter username" onchange="LogIn()" value="fedor" />&nbsp;
                        <button type="button" class="button-primary" onclick="LogIn()">Log In</button>
                    </p>
                    <p id="loggedin" hidden="hidden">
                        Welcome <span id="spanUsername"></span>!&nbsp;
                    </p>
                    <button type="button" class="button-primary" value="log out" onclick="LogOut()">Log out</button>
                </div>
                <p id="entergame">
                    Enter the game by clicking here:
                    <button id="btnEnterGame" onclick="EnterGame()" class="button" disabled="disabled">Enter Game</button>
                </p>
                <p id="status" style="color:red;font-weight:bold"></p>
                <hr />
                <h2>API list</h2>
                <h3>Species</h3>
                <ul>
                    <li><a href="api/species" target="_blank">All species</a></li>
                </ul>
                <h3>Areas</h3>
                <ul>
                    <li><a href="api/area" target="_blank">All areas</a></li>
                </ul>
                <h3>Population</h3>
                <ul>
                    <li><a href="api/swarm" target="_blank">All swarms</a></li>
                </ul>
                <h3>Players</h3>
                <ul>
                    <li><a href="api/player" target="_blank">All players</a></li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
